[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sui-bot"
version = "1.0.0"
description = "Telegram administration bot for S-UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "aiohttp>=3.11,<4",
  "psutil>=7,<8",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=22,<23",
  "redis>=6,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
sui-bot = "sui_bot.cli:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ASYNC", "S"]
ignore = ["E501", "S101"]
